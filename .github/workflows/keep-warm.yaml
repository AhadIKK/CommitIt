# Keep-warm for Render's free instance.
#
# The getUpdates poller, digest delivery, stale checks and auto-sync all run in
# the Render worker, and free instances hibernate after ~15 min idle.
#
# Why a loop instead of a plain every-10-minutes cron: GitHub fires `schedule`
# events best-effort and drops/delays high-frequency crons hard. Measured with
# `*/10`: 5 runs in 13h (gaps of 2-4.5h) instead of ~80. A cron at minute 0 —
# "*/10", or the "0 */6" tried first — fires exactly when GitHub's docs say
# load is highest and queued jobs get dropped; that 12:00Z tick never ran.
#
# So: schedule off the hour, ping in a loop, and let CONCURRENCY guarantee
# continuity. The job runs 2h30m but the schedule fires every 2h, so a trigger
# always lands while a job is running and the next run is queued the moment the
# current one ends. Gaps require GitHub to drop triggers for 2h30m straight.
# `push` is a second, independent trigger source, so the loop also re-arms on
# every deploy.
#
# Correctness does not depend on this: digests deliver on `dueAt <= now` and
# the stale/auto-sync jobs are bucket/delivery-id idempotent, so a gap delays
# work rather than losing it. This only keeps things punctual.
#
# Cost: one job at a time, so ~24 runner-hours/day — the unavoidable price of
# keeping another machine awake. Unlimited for public repos. A free uptime
# pinger does the same for ~zero compute; swap to that if this becomes
# unwelcome.
name: keep-warm

on:
  schedule:
    # minute 7, not 0: avoid the top-of-hour drop window.
    - cron: "7 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

# One at a time. A trigger arriving mid-run waits, then starts immediately when
# the current job ends — that handoff is what makes coverage continuous.
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # 2h30m of pings, 6 min of headroom.
    timeout-minutes: 156
    steps:
      - name: Ping Render health every 10 minutes for 2h30m
        run: |
          set -u
          deadline=$((SECONDS + 9000))
          streak=0
          longest=0
          pings=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              https://commitit-brqq.onrender.com/health || true)
            pings=$((pings + 1))
            if [ "$code" = "200" ]; then
              streak=0
            else
              streak=$((streak + 1))
              [ "$streak" -gt "$longest" ] && longest=$streak
            fi
            echo "$(date -u +%FT%TZ) health=$code streak=$streak"
            sleep 600
          done
          echo "pings=$pings longest_failure_streak=$longest"
          # 3 misses = 30 min unreachable: a real outage, not a cold start.
          test "$longest" -lt 3

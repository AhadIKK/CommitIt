<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="CommitIt sends one honest message about a repository: what got finished, what moved, and what needs a decision. Progress is finished tasks, never commit counts."
    />
    <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F1ECE0" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="CommitIt" />
    <meta
      property="og:description"
      content="A day of commits, as one message. Progress measured by finished tasks."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CommitIt</title>
    <!--
      Instrument Serif sets the progress sentence, Archivo the interface, IBM
      Plex Mono the data. They are self-hosted through @fontsource and
      imported in main.tsx, so there is no third-party request and no webfont
      shift. Nothing here should reach a CDN: a font that has to be fetched
      before it can be read is a font that will sometimes not arrive.
    -->
    <!--
      The theme is applied before first paint so there is no flash and no layout
      shift. It follows the system preference and defers to a saved choice. The
      CSS media query in tokens.css is the no-JS fallback.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("commitit-theme");
          var theme =
            saved === "night" || saved === "day"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "day"
                : "night";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* no storage: the CSS fallback still honours the system setting */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

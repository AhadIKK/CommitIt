# Render Blueprint — CommitIt (single-stack Node API + Supabase Postgres)
# Dashboard: Render → New → Blueprint → select AhadIKK/CommitIt repo.
# Env vars to set in dashboard (never commit secrets):
#   DATABASE_URL (Supabase pooled 6543 + ?pgbouncer=true),
#   DIRECT_URL (Supabase direct 5432, for `prisma migrate deploy`),
#   GITHUB_WEBHOOK_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_BOT_NAME,
#   TELEGRAM_DEFAULT_CHAT_ID, GitHub App vars (see .env.example),
#   SESSION_SECRET. PORT is auto-injected by Render — do NOT hardcode it.

services:
  - type: web
    name: commitit
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_NAME
        sync: false
      - key: TELEGRAM_DEFAULT_CHAT_ID
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY_BASE64
        sync: false
      - key: GITHUB_APP_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_INPUT_PRICE
        sync: false
      - key: AI_OUTPUT_PRICE
        sync: false
      - key: AI_MONTHLY_CAP_USD
        sync: false
      - key: STALE_CHECK_REPOS
        sync: false
      - key: STALE_DAYS
        sync: false
      - key: SYNC_INTERVAL_HOURS
        sync: false
